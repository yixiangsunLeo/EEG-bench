    submodule: third_party/eegmamba
    weights: null
  - key: singlem
    display: "SingLEM"
    pretraining_objective: raw_plus_frequency
    params: "3.3M"
    paper_rank: 19
    input_spec: {sfreq: 128, band: [0.5, 50], notch: 50, norm: minmax_pm1_open, channels: per_channel, window_s: 1.0, stride_s: 0.75, ea: false}
    official_repo: https://github.com/ttlabtuat/SingLEM
    benchmark_impl: third_party/eeg_fm_benchmark   # vendored implementation used for numbers
    submodule: third_party/singlem
    weights: null
  - key: luna_base
