# Dataset card. Facts: EEG-FM-Compass Table 14 / A3. Verify against MOABB after download.
key: bnci2014009
display_name: "BNCI2014009 (P300 speller, healthy)"
paradigm: p300
source:
  provider: moabb
  moabb_class: BNCI2014_009
n_subjects: 10
sessions: null                         # paper: 4 sessions x 3 runs; MOABB exposes 3 sessions — verify
n_channels: 16
montage: monopolar
channel_names: [Fz, FCz, Cz, CPz, Pz, Oz, F3, F4, C3, C4, CP3, CP4, P3, P4, PO7, PO8]
sfreq_native: 256
trial_length_s: 0.8
