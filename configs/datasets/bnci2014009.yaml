paper:
  in_table2: true
  loso_finetune_sessions: 1
  fewshot_ratio: "10% of one session"
  pretraining_leakage: []
canonical_version: null
# Official recipe (third_party/eeg_fm_benchmark/datasets/BNCI2014009/Preprocess_Dataset.py @680b12b)
benchmark_preprocess:
  moabb_paradigm: "P300(fmin=0.1, fmax=75)"
  session_kept: "0train"
  crop_samples: null                    # MOABB epoch 0.8 s @ 256 Hz; FMs pad to 1 s via --time_length (utils/preprocessing.py trim/pad)
  label_map: {Target: 0, NonTarget: 1}  # note: target is class 0 in the benchmark
  channel_names: [Fz, FCz, Cz, CPz, Pz, Oz, F3, F4, C3, C4, CP3, CP4, P3, P4, PO7, PO8]
  official_hparams_json: null
notes: "6x6 matrix speller, overt attention."
