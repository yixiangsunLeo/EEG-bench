  loso_finetune_sessions: 1
  fewshot_ratio: "30% of one session"
  pretraining_leakage: []
canonical_version: null
# Official recipe (third_party/eeg_fm_benchmark/datasets/BNCI2014004/Preprocess_Dataset.py @680b12b)
benchmark_preprocess:
  moabb_paradigm: "MotorImagery(fmin=0, fmax=120)"
  session_kept: "3test"                # NOTE: the 4th session (feedback), not the first
  crop_samples: null                    # full MOABB epoch (4.5 s @ 250 Hz = 1125 samples)
  label_map: {left_hand: 0, right_hand: 1}
