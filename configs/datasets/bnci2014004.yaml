# Dataset card. Facts: EEG-FM-Compass Table 14 / A3. Verify against MOABB after download.
key: bnci2014004
display_name: "BNCI2014004 (BCI Competition IV 2b)"
paradigm: motor_imagery
source:
  provider: moabb
  moabb_class: BNCI2014_004
n_subjects: 9
sessions: ["0", "1", "2", "3", "4"]    # 5 sessions: 2 screening (no feedback) + 3 feedback; verify MOABB names
n_channels: 3
montage: bipolar                       # C3, Cz, C4 bipolar derivations
channel_names: null
sfreq_native: 250
trial_length_s: 4.5
